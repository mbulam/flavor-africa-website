# Flavor Trivia reminder: every evening at 7 pm Nairobi time (16:00 UTC), phones that tapped
# "Remind me" in the app's Games tab get a nudge to play. Added 16 Nov 2026.
# The site only sends it once a day, so the later runs are just a safety net in case GitHub is late.
name: Trivia reminder
on:
  schedule:
    - cron: "0 16 * * *"
    - cron: "40 16 * * *"
    - cron: "30 17 * * *"
  workflow_dispatch:
jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      - name: Send today's reminder
        run: |
          for i in $(seq 1 30); do
            r=$(curl -fsS "https://flavorafricagroup.org/api/push?remind=trivia" || echo '{}')
            echo "$r"
            echo "$r" | grep -q '"more":true' || break
            sleep 3
          done
