name: probe
on:
  push:
    branches: [f10-probe]
    paths: [_probe/probe.py]
permissions:
  contents: write
jobs:
  p:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 _probe/probe.py
      - run: |
          git config user.name bot; git config user.email bot@users.noreply.github.com
          git add _probe/apple.json; git commit -m "probe data"; git push origin HEAD:f10-probe
