# The Flavor 10 · Kenya: updates itself every morning, no one needs to do anything.
# 06:10 Nairobi time = 03:10 UTC. It fetches the source charts, ranks them, rebuilds the
# homepage and pushes; Netlify then publishes the site as usual.
# To force a run: edit _charts/flavor10/RUN (any change) and push, or use "Run workflow" on GitHub.
name: Flavor 10 daily update
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["_charts/flavor10/RUN"]
permissions:
  contents: write
concurrency:
  group: flavor10
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's source charts
        id: fetch
        run: |
          set +e
          python3 _charts/flavor10/fetch.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Rank and rebuild the homepage
        if: steps.fetch.outputs.code == '0'
        run: |
          python3 _charts/flavor10/daily.py
          python3 _site.py
      - name: Publish
        run: |
          git config user.name "flavor10-bot"
          git config user.email "flavor10-bot@users.noreply.github.com"
          git add -A _charts/flavor10 index.html sitemap.xml ":!_charts/flavor10/debug"
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Flavor 10: daily update $(TZ=Africa/Nairobi date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
