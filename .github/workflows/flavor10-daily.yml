# The Flavor 10 · Kenya: updates itself every morning, no one needs to do anything.
# The same run also releases scheduled stories to Google (sitemap + noindex) on their date.
# 06:10 Nairobi time = 03:10 UTC. It fetches the source charts, ranks them, rebuilds the
# homepage and pushes; Cloudflare Pages then publishes the site as usual.
# Runs ONCE a day. To force an extra run, use "Run workflow" on GitHub (Actions tab).
name: Flavor 10 daily update
on:
  schedule:
    - cron: "10 3 * * *"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: flavor10
  cancel-in-progress: false
jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Fetch today's source charts
        id: fetch
        run: |
          set +e
          python3 _charts/flavor10/fetch.py
          echo "code=$?" >> "$GITHUB_OUTPUT"
      - name: Rank today's chart
        if: steps.fetch.outputs.code == '0'
        run: python3 _charts/flavor10/daily.py
      - name: Rebuild the site (homepage, sitemap, scheduled stories)
        # Runs even if a chart source is down, so scheduled stories still join the
        # sitemap and lose their noindex tag on their date.
        run: python3 _site.py
      - name: Publish
        run: |
          git config user.name "flavor10-bot"
          git config user.email "flavor10-bot@users.noreply.github.com"
          git add -A _charts/flavor10 *.html sitemap.xml
          if git diff --cached --quiet; then echo "Nothing changed"; exit 0; fi
          git commit -m "Daily update (Flavor 10 + scheduled stories) $(TZ=Africa/Nairobi date +%F)"
          for i in 1 2 3; do git pull --rebase origin main && git push origin HEAD:main && exit 0; sleep 10; done
          exit 1
