<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow">
<title>Flavor Africa inbox</title>
<style>body{margin:0;font-family:Poppins,"Segoe UI",Arial,sans-serif;color:#15102A;background:#fff;line-height:1.5}main{max-width:760px;margin:0 auto;padding:24px 16px 60px}
h1{font-size:26px;margin:0 0 4px;color:#2A0174}h2{font-size:15px;letter-spacing:.1em;text-transform:uppercase;border-top:5px solid #2A0174;padding-top:10px;margin:36px 0 10px}
p.s{color:#5E5873;margin:0 0 8px}li{padding:12px 0;border-bottom:1px solid #E4E0EE}ul,ol{list-style:none;margin:0;padding:0}small{display:block;color:#5E5873;font-size:12px;margin-top:4px}
table{border-collapse:collapse;width:100%}td{padding:8px 0;border-bottom:1px solid #E4E0EE}td:last-child{text-align:right;font-weight:600}</style></head>
<body><main><h1>flavor.africa inbox</h1><p class="s" id="s">Loading…</p><div id="o"></div></main>
<script>(function(){var key=location.hash.slice(1),s=document.getElementById("s"),o=document.getElementById("o");
function e(x){return String(x==null?"":x).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
if(!key){s.textContent="This page needs the private link.";return}
fetch("/api/fanseat?key="+encodeURIComponent(key)).then(function(r){return r.json()}).then(function(d){
if(!d.ok){s.textContent=d.error==="locked"?"That link isn't right.":"The inbox isn't set up yet.";return}
s.textContent="Fan Seat questions and the fans' pick. Private: don't share this link.";var h="",shows={},weeks={};
d.questions.forEach(function(q){(shows[q.show]=shows[q.show]||[]).push(q)});
h+="<h2>Fan Seat questions</h2>";if(!d.questions.length)h+='<p class="s">No questions yet.</p>';
Object.keys(shows).forEach(function(k){h+='<p class="s"><b>'+e(k)+"</b> · "+shows[k].length+"</p><ul>";shows[k].forEach(function(q){h+="<li>"+e(q.q)+"<small>"+e(q.name||"No name")+" · "+e(new Date(q.at).toLocaleString("en-KE",{timeZone:"Africa/Nairobi"}))+"</small></li>"});h+="</ul>"});
d.votes.forEach(function(v){(weeks[v.week]=weeks[v.week]||[]).push(v)});
h+="<h2>Fans' pick, by week</h2>";if(!d.votes.length)h+='<p class="s">No picks yet.</p>';
Object.keys(weeks).forEach(function(k){h+='<p class="s"><b>Week of '+e(k)+"</b></p><table>";weeks[k].forEach(function(v){h+="<tr><td>"+e(v.song)+"</td><td>"+v.n+"</td></tr>"});h+="</table>"});
o.innerHTML=h}).catch(function(){s.textContent="Couldn't load. Check your connection."})})();</script></body></html>
